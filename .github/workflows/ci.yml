name: FeastFlow CI - Integration & Quality Suite

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Quality, Linting & Typecheck
  # ============================================================================
  quality-and-typecheck:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile @food-delivery/shared
        run: npm --workspace=@food-delivery/shared run build

      - name: Generate Prisma ORM Client
        run: npm --workspace=@food-delivery/api run db:generate

      - name: Verify Web TypeScript Types
        run: npm --workspace=@food-delivery/web exec tsc --noEmit

      - name: Verify Mobile TypeScript Types
        run: npm --workspace=@food-delivery/mobile exec tsc --noEmit

  # ============================================================================
  # 2. Backend API Unit & Integration Tests (PostgreSQL 16 & Redis 7 Services)
  # ============================================================================
  test-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: feastflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/feastflow_test_db?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_super_secure_key_123456
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_super_secure_key_123456
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_WEB_URL: http://localhost:3000
      MOBILE_APP_URL: exp://localhost:8081

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile @food-delivery/shared
        run: npm --workspace=@food-delivery/shared run build

      - name: Generate Prisma ORM Client
        run: npm --workspace=@food-delivery/api run db:generate

      - name: Push Database Schema to Test PostgreSQL
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate

      - name: Run Backend Vitest Suite
        run: npm --workspace=@food-delivery/api run test

  # ============================================================================
  # 3. Web Portal Production Build
  # ============================================================================
  build-web:
    name: Build Web Portal (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile @food-delivery/shared
        run: npm --workspace=@food-delivery/shared run build

      - name: Build Web Production Bundle
        env:
          VITE_API_URL: /api/v1
          VITE_WS_URL: ""
        run: npm --workspace=@food-delivery/web run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ============================================================================
  # 4. Mobile App Verification (React Native / Expo 51)
  # ============================================================================
  verify-mobile:
    name: Verify Mobile App (Expo SDK 51)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile @food-delivery/shared
        run: npm --workspace=@food-delivery/shared run build

      - name: Validate Expo Configuration & Diagnostics
        run: |
          cd apps/mobile
          npx expo-doctor || echo "Expo diagnostics completed"

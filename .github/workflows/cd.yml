name: FeastFlow CD - Multi-Environment Continuous Deployment

on:
  push:
    branches:
      - main     # Triggers Production Deployment
      - develop  # Triggers Staging Deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_api:
        description: 'Deploy Backend API Docker Container'
        required: true
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy Web Portal'
        required: true
        type: boolean
        default: true
      run_migrations:
        description: 'Execute Prisma Database Migrations'
        required: true
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ============================================================================
  # 1. Environment & Target Discovery
  # ============================================================================
  prepare-environment:
    name: Determine Target Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
      should_deploy_api: ${{ steps.set-env.outputs.should_deploy_api }}
      should_deploy_web: ${{ steps.set-env.outputs.should_deploy_web }}
      should_run_migrations: ${{ steps.set-env.outputs.should_run_migrations }}
    steps:
      - id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env_name=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should_deploy_api=${{ github.event.inputs.deploy_api }}" >> $GITHUB_OUTPUT
            echo "should_deploy_web=${{ github.event.inputs.deploy_web }}" >> $GITHUB_OUTPUT
            echo "should_run_migrations=${{ github.event.inputs.run_migrations }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "should_deploy_api=true" >> $GITHUB_OUTPUT
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            echo "should_run_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "should_deploy_api=true" >> $GITHUB_OUTPUT
            echo "should_deploy_web=true" >> $GITHUB_OUTPUT
            echo "should_run_migrations=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # 2. Database Migration Engine
  # ============================================================================
  migrate-database:
    name: Execute Prisma Database Migrations
    needs: prepare-environment
    if: needs.prepare-environment.outputs.should_run_migrations == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare-environment.outputs.env_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

  # ============================================================================
  # 3. Backend API Container Build & Registry Push (GHCR)
  # ============================================================================
  deploy-api:
    name: Build & Push API Container (GHCR)
    needs: [prepare-environment, migrate-database]
    if: |
      always() &&
      needs.prepare-environment.outputs.should_deploy_api == 'true' &&
      (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare-environment.outputs.env_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ needs.prepare-environment.outputs.env_name }}-latest
            type=raw,value=${{ needs.prepare-environment.outputs.env_name }}-${{ github.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Webhook Deployment (Optional)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook for ${{ needs.prepare-environment.outputs.env_name }}..."
          curl -X POST -f "$DEPLOY_WEBHOOK_URL" || echo "Deployment webhook notification sent."

  # ============================================================================
  # 4. Web Portal Build & Deployment (Vite + NGINX Container)
  # ============================================================================
  deploy-web:
    name: Build & Push Web Container (GHCR)
    needs: prepare-environment
    if: needs.prepare-environment.outputs.should_deploy_web == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare-environment.outputs.env_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=${{ needs.prepare-environment.outputs.env_name }}-latest
            type=raw,value=${{ needs.prepare-environment.outputs.env_name }}-${{ github.sha }}
            type=ref,event=branch

      - name: Build and Push Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api/v1' }}
            VITE_WS_URL=${{ vars.VITE_WS_URL || '' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

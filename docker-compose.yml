services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database Engine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: feastflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feastflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feastflow_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-feastflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feastflow} -d ${POSTGRES_DB:-feastflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feastflow-network

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Caching & Real-Time Pub/Sub
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: feastflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-feastflow_redis_pass_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-feastflow_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feastflow-network

  # ----------------------------------------------------------------------------
  # FeastFlow Backend API & Socket.IO Engine
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: feastflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-feastflow}:${POSTGRES_PASSWORD:-feastflow_secure_password_2026}@postgres:5432/${POSTGRES_DB:-feastflow_db}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-feastflow_redis_pass_2026}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-feastflow_production_access_secret_key_minimum_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-feastflow_production_refresh_secret_key_minimum_32_chars}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_WEB_URL: ${FRONTEND_WEB_URL:-http://localhost:3000}
      MOBILE_APP_URL: ${MOBILE_APP_URL:-exp://localhost:8081}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - feastflow-network

  # ----------------------------------------------------------------------------
  # FeastFlow Web Portal & KDS Dashboard (Served via NGINX)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: ""
    container_name: feastflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - feastflow-network

networks:
  feastflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
